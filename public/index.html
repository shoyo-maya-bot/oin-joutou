<style>
/* Layout: 画面いっぱいのキャンバス（深夜のオフィスの机）。タイトルと結果はキャンバスの上に重ねる。黒×朱×金の特攻服配色で、全部の文字に太い縁取り。 */

  background:linear-gradient(180deg,#fff6c2 0%,var(--gold) 45%,var(--gold-dk) 55%,#ffe27a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;

@media (max-width:480px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}

.sub span{display:inline-block;transform:skewX(10deg)}
.sub.tw{display:inline-grid;place-items:center;text-decoration:none;background:#fff;color:#000;border-color:#fff}

<script>
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d'),game=$('#game');
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT_HIT='"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif',FONT_SEAL='"Yuji Syuku","Hiragino Mincho ProN",serif',FONT_LED='"DotGothic16",monospace',FONT_UI='"Zen Kaku Gothic New","Hiragino Sans",sans-serif';

/* ---------- layout ---------- */
let W=960,H=600,dpr=1,portrait=false,DOC={w:180,h:232},BOX=58,AREA={};
function layout(){
  const cw=game.clientWidth||960,ch=game.clientHeight||600;
  portrait=ch>cw*1.1;
  W=portrait?600:960;H=Math.round(W*ch/cw);
  dpr=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  DOC=portrait?{w:168,h:216}:{w:176,h:226};BOX=portrait?60:58;
  const pileW=portrait?0:120;
  AREA={x0:20,y0:portrait?150:110,x1:W-pileW-20-DOC.w,y1:H-(portrait?120:30)-DOC.h};
}
addEventListener('resize',layout);layout();

/* ---------- content ---------- */
const SUBJ=['部長の椅子の買い替え','会議室の時計の電池交換','ペーパーレス推進会議の資料印刷','ハンコ押印効率化のためのハンコ購入','忘年会の二次会会場','コピー用紙 500枚×40箱','福岡出張（明太子は自費）','観葉植物の水やり当番の新設','シュレッダーの刃の交換','有給休暇（理由：私用）','残業申請（理由：決裁が多い）','社内報の誤字の訂正'];
const BOSSY=['社長行き','専務行き','役員会'];
const TRAPS=['社長の別荘購入（経費で）','部長のゴルフ会員権','社長の愛犬の誕生日会','謎の口座へ振込 9,800万円','専務の私物クルーザー'];
const LINES={start:['今日中に全部片付けろ!!','定時までに終わらせろよ'],miss:['遅いッ!!','何やってんだ!','寝てるのか!?','山になってるぞ!!'],good:['ほう…','悪くない','その調子だ'],fever:['なんだその速さは!?','ハンコが…燃えている…!?','これが…新人…!?'],trap:['バカモン!! それは押すな!!','クビにしたいのか!?'],rude:['礼儀がなっとらん!!','上司あてはお辞儀だろうが!'],over:['へりくだりすぎだ!']};

/* ---------- audio ---------- */
let AC=null,master=null,bgmOn=false,bgmT0=0,nextStep=0,stepIdx=0;
const BPM=128,BEAT=60/BPM;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.7;master.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function env(node,t,a,d,v){const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);node.connect(g).connect(master);return g}
function noiseBuf(len){const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
let NB=null;
function kick(t,v=.9){const o=AC.createOscillator();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);env(o,t,.002,.22,v);o.start(t);o.stop(t+.3)}
function snare(t,v=.35){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=1500;s.connect(f);env(f,t,.001,.14,v);s.start(t);s.stop(t+.2)}
function hat(t,v=.12){const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;s.connect(f);env(f,t,.001,.04,v);s.start(t);s.stop(t+.06)}
function tone(t,fr,d,v,type='sawtooth',cut=1200){const o=AC.createOscillator();o.type=type;o.frequency.value=fr;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=cut;o.connect(f);env(f,t,.005,d,v);o.start(t);o.stop(t+d+.05)}
const BASS=[45,45,57,45,48,48,60,50, 43,43,55,43,47,47,59,52];
const LEAD=[69,0,72,0,74,72,0,69, 67,0,69,72,0,74,76,0];
const mtof=m=>440*Math.pow(2,(m-69)/12);
function startBgm(){if(!ac())return;NB=NB||noiseBuf(.3);bgmOn=true;bgmT0=AC.currentTime+.08;nextStep=bgmT0;stepIdx=0}
function bgmTick(){
  if(!bgmOn||!AC)return;
  while(nextStep<AC.currentTime+.12){
    const t=nextStep,s=stepIdx%16,bar=Math.floor(stepIdx/16);
    if(s%4===0)kick(t);if(s%8===4)snare(t);if(s%2===0)hat(t,.1);else if(fever>0)hat(t,.07);
    if(s%2===0)tone(t,mtof(BASS[(s/2+bar*8)%16]),BEAT*.45,.16,'sawtooth',500+(fever>0?700:0));
    if(fever>0&&LEAD[s])tone(t,mtof(LEAD[s]+12),BEAT*.4,.07,'square',2600);
    nextStep+=BEAT/4;stepIdx++;
  }
}
function stopBgm(){bgmOn=false}
function sfxStamp(q){if(!ac())return;NB=NB||noiseBuf(.3);const t=AC.currentTime;kick(t,1);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=900;s.connect(f);env(f,t,.001,.09,.6);s.start(t);s.stop(t+.12);
  if(q>=3){tone(t+.02,1568,.25,.09,'triangle',6000);tone(t+.08,2093,.3,.07,'triangle',6000)}}
function sfxMiss(){if(!ac())return;const t=AC.currentTime;tone(t,110,.35,.25,'square',900);tone(t+.05,104,.35,.2,'square',900)}
function sfxWhoosh(){if(!ac())return;NB=NB||noiseBuf(.3);const t=AC.currentTime,s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.setValueAtTime(400,t);f.frequency.exponentialRampToValueAtTime(3000,t+.25);s.connect(f);env(f,t,.02,.25,.25);s.start(t);s.stop(t+.3)}
function sfxFever(){if(!ac())return;const t=AC.currentTime;[60,64,67,72,76,79,84].forEach((m,i)=>tone(t+i*.05,mtof(m+12),.3,.08,'square',4000))}

/* ---------- state ---------- */
const DUR=90;
let state='title',T=0,score=0,combo=0,maxCombo=0,perfects=0,trapsSeen=0,pile=0,gauge=0,fever=0,streak=0;
let docs=[],parts=[],texts=[],rings=[],flyers=[],boss={line:'',t:0,mood:0},shake=0,flash=0,flashCol='255,255,255',slowmo=0,endT=0,endKind='',tutorial={};
let spawnBeat=0,aim={x:W/2,y:H/2},pointer=false,stampAnim=0,stampBow=false,pending=null;
let myName=([...(ls.get('ouin-name')||'山田')].slice(0,3).join(''))||'山田';
$('#nm').value=myName;$('#t-seal').textContent=myName;
const showBest=()=>{const b=Number(ls.get('ouin-best')||0);$('#best').textContent=b?`自己ベスト ${b.toLocaleString()} pt`:''};showBest();
$('#nm').addEventListener('input',e=>{$('#t-seal').textContent=[...e.target.value].slice(0,3).join('')||'山田'});

/* ---------- seals (pre-rendered) ---------- */
let SEALS=[],GOLD=[];
function makeSeal(col,kas){
  const R=44,s=R*2+16,c=document.createElement('canvas');c.width=c.height=s*2;const g=c.getContext('2d');g.scale(2,2);
  const cx=s/2,cy=s/2;g.strokeStyle=g.fillStyle=col;g.lineWidth=5;g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();
  const ch=[...myName],fs=ch.length>=3?R*.62:ch.length===2?R*.82:R*1.2;
  g.font=`${fs}px ${FONT_SEAL}`;g.textAlign='center';g.textBaseline='middle';ch.forEach((k,i)=>g.fillText(k,cx,cy+(i-(ch.length-1)/2)*fs*.92));
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<60+kas*700;i++){const a=Math.random()*7,r=Math.random()*R*1.1;g.globalAlpha=.4+Math.random()*.6;g.beginPath();g.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,Math.random()*(.8+kas*2.4),0,7);g.fill()}
  return c;
}
function buildSeals(){SEALS=[0,.1,.2,.5,.8].map(k=>makeSeal('#e8262b',k));GOLD=[0,.1].map(k=>makeSeal('#ffb400',k))}

/* ---------- spawning ---------- */
function audioNow(){return AC&&bgmOn?AC.currentTime-bgmT0:T}
function approach(){return lerp(1.3,.85,clamp(T/DUR,0,1))*(fever>0?.9:1)}
function freeSpot(){
  let best=null,bd=-1;
  for(let k=0;k<14;k++){const x=rnd(AREA.x0,Math.max(AREA.x0+1,AREA.x1)),y=rnd(AREA.y0,Math.max(AREA.y0+1,AREA.y1));
    let d=1e9;docs.forEach(o=>{if(o.state!=='gone')d=Math.min(d,Math.hypot(o.x-x,o.y-y))});if(d>bd){bd=d;best={x,y}}if(d>DOC.w*1.1)break}
  return best;
}
function schedule(){
  const now=audioNow(),prog=clamp(now/DUR,0,1);
  const every=prog<.18?4:prog<.45?2:prog<.75?(Math.random()<.35?1:2):(Math.random()<.6?1:2);
  while((spawnBeat*BEAT)-approach()-.4<now){
    const hitT=spawnBeat*BEAT;
    if(hitT>DUR-.6){spawnBeat+=999;break}
    if(spawnBeat>=4)spawn(hitT,prog);
    spawnBeat+=fever>0?Math.max(1,every-1):every;
  }
}
function spawn(hitT,prog){
  let type='norm';const r=Math.random();
  if(prog>.08&&r<.24)type='bow';else if(prog>.2&&r<.36)type='trap';else if(prog>.3&&r<.44)type='multi';
  if(!tutorial.bow&&type==='bow')tutorial.bow=1;
  const p=freeSpot();if(!p)return;
  const d={type,x:p.x,y:p.y,rot:rnd(-7,7),hitT,born:audioNow(),state:'in',boxes:[],subj:type==='trap'?pick(TRAPS):pick(SUBJ),dest:type==='bow'?pick(BOSSY):'',from:{x:rnd(-200,W+200),y:-DOC.h-80,r:rnd(-180,180)},hits:[]};
  if(type==='multi'){for(let i=0;i<3;i++)d.boxes.push({rx:DOC.w-BOX-12-(2-i)*(BOX*.86),ry:DOC.h-BOX-16,hitT:hitT+i*BEAT,done:0,bow:false})}
  else d.boxes.push({rx:DOC.w-BOX-12,ry:44,hitT,done:0,bow:type==='bow',trap:type==='trap'});
  docs.push(d);sfxWhoosh();
}

/* ---------- input ---------- */
function toL(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('pointermove',e=>{const p=toL(e);aim=p;pointer=true;
  if(pending&&pending.touch&&p.y-pending.y>26){const pd=pending;pending=null;judge(pd.x,pd.y,pd.t,true)}});
cv.addEventListener('pointerleave',()=>pointer=false);
cv.addEventListener('pointerdown',e=>{
  if(state!=='play')return;e.preventDefault();ac();const p=toL(e);aim=p;pointer=true;
  const t=audioNow();
  if(e.pointerType==='touch'){pending={x:p.x,y:p.y,t,touch:true,at:performance.now()};return}
  judge(p.x,p.y,t,e.button===2||e.shiftKey);
});
addEventListener('pointerup',()=>{if(pending){const pd=pending;pending=null;judge(pd.x,pd.y,pd.t,false)}});
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(state!=='play'){if((e.key==='Enter'||e.key===' ')&&state!=='end'&&$('#o-board').hidden&&e.target.tagName!=='BUTTON'){e.preventDefault();start()}return}
  if(e.key==='z'||e.key==='j'){judge(aim.x,aim.y,audioNow(),false)}
  if(e.key==='x'||e.key==='k'){judge(aim.x,aim.y,audioNow(),true)}
});

/* ---------- judging ---------- */
const WIN=()=>fever>0?1.5:1;
function boxRect(d,b){return{x:d.x+b.rx,y:d.y+b.ry,s:BOX}}
function judge(x,y,t,bow){
  stampAnim=1;stampBow=bow;
  let best=null,bd=1e9,onDoc=null;
  for(const d of docs){if(d.state!=='wait')continue;
    if(x>d.x-6&&x<d.x+DOC.w+6&&y>d.y-6&&y<d.y+DOC.h+6)onDoc=d;
    for(const b of d.boxes){if(b.done)continue;const r=boxRect(d,b),m=14;
      if(x>r.x-m&&x<r.x+r.s+m&&y>r.y-m&&y<r.y+r.s+m){const e=Math.abs(t-b.hitT);if(e<bd){bd=e;best={d,b}}}}}
  if(!best){
    if(onDoc){hitText(x,y,'枠外!','#fff',.8);breakCombo(false)}
    else{puff(x,y,6,'#888');}
    return;
  }
  const {d,b}=best,e=t-b.hitT,w=WIN();
  if(b.trap){b.done=1;trapStamped(d,b);return}
  if(e<-.24*w){b.done=1;stampOn(d,b,x,y,4);hitText(x,y-20,'フライング','#aaa',.9);breakCombo(false);finishDoc(d);return}
  if(b.bow!==bow){b.done=1;stampOn(d,b,x,y,3,bow);hitText(x,y-20,b.bow?'無礼者!!':'へりくだりすぎ','#ff7aa8',1.1);say(b.bow?'rude':'over',2);breakCombo(true);finishDoc(d);return}
  const ae=Math.abs(e);let q,label,col,pts;
  if(ae<=.06*w){q=3;label='神押し!!';col='#ffcb2e';pts=300;perfects++}
  else if(ae<=.12*w){q=2;label='承認!';col='#ffffff';pts=200}
  else{q=1;label='まあ良し';col='#9fd6ff';pts=100}
  b.done=1;b.q=q;
  combo++;maxCombo=Math.max(maxCombo,combo);
  const mul=(1+Math.min(combo,100)/40)*(fever>0?2:1);
  const add=Math.round(pts*mul);score+=add;
  if(q===3){streak++;if(streak%8===0&&pile>0){pile--;hitText(W-70,H*.5,'山が減った!','#ffcb2e',1)}}else streak=0;
  if(fever<=0){gauge=Math.min(1,gauge+(q===3?.075:q===2?.05:.03));if(gauge>=1)startFever()}
  stampOn(d,b,x,y,q===3?0:q===2?1:2,bow);
  impact(x,y,q,bow);
  hitText(x,y-30,label,col,q===3?1.5:1.2,`+${add}`);
  if(combo===10||combo===30)say('good',1);
  finishDoc(d);
}
function stampOn(d,b,x,y,v,bow){
  const r=boxRect(d,b);const cx=r.x+r.s/2,cy=r.y+r.s/2;
  const px=clamp(x,r.x+4,r.x+r.s-4),py=clamp(y,r.y+4,r.y+r.s-4);
  d.hits.push({x:(px*.4+cx*.6)-d.x,y:(py*.4+cy*.6)-d.y,r:(bow?-18:rnd(-4,4)),img:fever>0?pick(GOLD):SEALS[v]||SEALS[0]});
}
function finishDoc(d){if(d.boxes.every(b=>b.done)){d.state='done';d.doneT=audioNow()}}
function trapStamped(d,b){
  stampOn(d,b,d.x+b.rx+BOX/2,d.y+b.ry+BOX/2,0,false);
  sfxMiss();shake=Math.max(shake,22);flash=.6;flashCol='232,38,43';
  hitText(d.x+DOC.w/2,d.y+DOC.h/2,'不正承認!!','#ff3b40',1.8,'山+3');
  pile+=3;breakCombo(true);say('trap',3);d.state='busted';d.doneT=audioNow();
}
function breakCombo(loud){if(combo>=10)hitText(W/2,H*.32,`${combo} コンボ 途切れた…`,'#aaa',1);combo=0;streak=0;if(loud){boss.mood=1}}
function startFever(){fever=8;gauge=1;sfxFever();flash=.8;flashCol='255,203,46';say('fever',3);hitText(W/2,H*.4,'ハンコ覚醒!!','#ffcb2e',2.4,'スコア2倍');for(let i=0;i<4;i++)rings.push({x:W/2,y:H*.4,r:20+i*30,v:900+i*200,a:1,col:'255,203,46'})}

/* ---------- effects ---------- */
function impact(x,y,q,bow){
  sfxStamp(q);
  if(RM){flash=Math.max(flash,.2);return}
  shake=Math.max(shake,q===3?16:q===2?10:6);
  flash=Math.max(flash,q===3?.45:.22);flashCol=fever>0?'255,203,46':'255,255,255';
  const col=fever>0?['#ffcb2e','#ff8a00','#fff3a0']:['#e8262b','#ff4d4d','#b0101a'];
  for(let i=0;i<(q===3?46:24);i++){const a=rnd(0,Math.PI*2),s=rnd(120,q===3?720:420);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-rnd(0,180),r:rnd(2,q===3?9:6),c:pick(col),life:rnd(.4,.9),t:0,g:900})}
  rings.push({x,y,r:BOX*.4,v:q===3?700:420,a:1,col:fever>0?'255,203,46':'232,38,43'});
  if(q===3)rings.push({x,y,r:BOX*.2,v:1100,a:.8,col:'255,255,255'});
  texts.push({x:x+rnd(-60,60),y:y+rnd(-70,-30),s:pick(['ドンッ','バンッ','ズドン','ダンッ']),c:'#fff',sz:q===3?52:38,t:0,life:.55,rot:rnd(-.35,.35),onom:1});
  if(q===3)slowmo=.06;
}
function puff(x,y,n,c){for(let i=0;i<n;i++){const a=rnd(0,7);parts.push({x,y,vx:Math.cos(a)*rnd(40,140),vy:Math.sin(a)*rnd(40,140),r:rnd(2,4),c,life:.35,t:0,g:0})}}
function hitText(x,y,s,c,scale,sub){texts.push({x,y,s,c,sz:34*scale,t:0,life:.9,rot:rnd(-.12,.12),sub})}
function say(kind,pri){if(boss.t>0&&pri<2)return;boss.line=pick(LINES[kind]);boss.t=2.2;boss.mood=kind==='good'||kind==='fever'?2:kind==='start'?0:1}

/* ---------- flow ---------- */
function start(){
  myName=([...($('#nm').value||'').trim()].slice(0,3).join(''))||'山田';ls.set('ouin-name',myName);buildSeals();
  state='play';T=0;score=0;combo=0;maxCombo=0;perfects=0;trapsSeen=0;pile=0;gauge=0;fever=0;streak=0;docs=[];parts=[];texts=[];rings=[];flyers=[];spawnBeat=0;endT=0;tutorial={};
  layout();$('#o-title').hidden=true;$('#o-result').hidden=true;
  requestRun();startBgm();say('start',3);hitText(W/2,H*.42,'始業!!','#ffcb2e',2.2,'リングが重なった瞬間に押せ');
}
function endGame(kind){
  if(state!=='play')return;state='end';endKind=kind;endT=0;stopBgm();
  if(kind==='clear'){hitText(W/2,H*.45,'定時!!','#ffcb2e',3);flash=1;flashCol='255,203,46';for(let i=0;i<60;i++)flyers.push({x:rnd(0,W),y:rnd(-H,-20),vx:rnd(-60,60),vy:rnd(120,360),r:rnd(0,6),vr:rnd(-4,4),conf:1})}
  else{hitText(W/2,H*.45,'書類に埋もれた…','#ff3b40',2.2);for(let i=0;i<90;i++)flyers.push({x:rnd(-40,W+40),y:rnd(-H*1.6,-40),vx:rnd(-30,30),vy:rnd(260,520),r:rnd(-.6,.6),vr:rnd(-2,2),pileUp:1})}
  if(AC){const t=AC.currentTime;if(kind==='clear'){[72,76,79,84].forEach((m,i)=>tone(t+i*.12,mtof(m),.5,.1,'square',3000))}else{[60,56,52,48].forEach((m,i)=>tone(t+i*.2,mtof(m),.5,.12,'sawtooth',900))}}
}
function showResult(){
  state='result';
  const sc=score,clear=endKind==='clear';
  const ranks=[[80000,'社長','伝説の押印師'],[55000,'専務','役員待遇'],[35000,'部長','昇進認定'],[18000,'課長','まあまあ'],[8000,'係長','もっと押せ'],[0,'新人','研修やり直し']];
  let rk=ranks.find(r=>sc>=r[0]);if(!clear)rk=sc>=18000?[0,'課長','過労で早退']:[0,'窓際','左遷'];
  $('#r-verdict').textContent=clear?'定時退社!!':'書類に埋もれた…';
  $('#r-rank').textContent=rk[1];$('.rank .r2').textContent=rk[2]||'';
  $('#r-score').textContent=sc.toLocaleString();$('#r-combo').textContent=maxCombo;$('#r-perfect').textContent=perfects;$('#r-trap').textContent=trapsSeen;
  const q=clear?(sc>=35000?'…やるじゃないか。明日も頼む':sc>=18000?'まあ、合格だ':'定時に帰るとは良い度胸だ'):'全部やり直しだ!!';
  $('#r-quote').innerHTML='部長「<b></b>」';$('#r-quote b').textContent=q;
  const best=Number(ls.get('ouin-best')||0);if(sc>best)ls.set('ouin-best',String(sc));
  $('#r-note').textContent=sc>best?'自己ベスト更新!!':`自己ベスト ${Math.max(best,sc).toLocaleString()} pt`;
  $('#o-result').hidden=false;showBest();
  saveLocal({name:rankName(),score:sc,role:rk[1],combo:maxCombo,at:Date.now(),clear:clear?1:0});
  lastRun={score:sc,role:rk[1],combo:maxCombo,perfect:perfects,clear:clear?1:0,rid:runId};
  $('#rk-name').value=rankName();$('#r-myrank').hidden=true;$('#btn-post').hidden=false;$('#btn-post').disabled=false;
  $('#btn-tweet').href=tweet();
  if(!runId)$('#r-myrank').hidden=false,$('#r-myrank').textContent='ランキングに接続できなかったので、自分の記録にだけ保存しました';
}
$('#btn-start').addEventListener('click',start);
$('#btn-again').addEventListener('click',start);
$('#btn-share').addEventListener('click',()=>{
  const txt=`押印上等!! ${$('#r-verdict').textContent} 役職「${$('#r-rank').textContent}」 ${score.toLocaleString()}pt / 最大${maxCombo}コンボ`;
  const done=()=>{$('#r-note').textContent='コピーしました'};
  try{navigator.clipboard.writeText(txt).then(done,()=>{$('#r-note').textContent=txt})}catch(e){$('#r-note').textContent=txt}
});

/* ---------- update ---------- */
let last=performance.now();
function frame(now){
  let dt=Math.min(.05,(now-last)/1000);last=now;
  if(slowmo>0){slowmo-=dt;dt*=.35}
  T+=dt;bgmTick();
  if(state==='play')update(dt);
  if(state==='end'){endT+=dt;if(endT>2.4)showResult()}
  fx(dt);draw();
  requestAnimationFrame(frame);
}
function update(dt){
  const t=audioNow();
  if(pending&&performance.now()-pending.at>200){const pd=pending;pending=null;judge(pd.x,pd.y,pd.t,false)}
  if(t>=DUR){endGame('clear');return}
  schedule();
  if(fever>0){fever-=dt;gauge=Math.max(0,fever/8);if(fever<=0){gauge=0;hitText(W/2,H*.4,'覚醒終了','#aaa',1.2)}}
  for(const d of docs){
    const a=approach();
    if(d.state==='in'){if(t>=d.hitT-a)d.state='wait'}
    if(d.state==='wait'){
      for(const b of d.boxes){if(b.done)continue;
        if(t>b.hitT+.22*WIN()){b.done=1;
          if(b.trap){trapsSeen++;score+=150;hitText(d.x+DOC.w/2,d.y+DOC.h*.4,'見抜いた!','#ff7aa8',1.2,'+150');d.state='trashed';d.doneT=t}
          else{b.miss=1;missDoc(d);break}}}
      if(d.state==='wait')finishDoc(d);
    }
  }
  docs=docs.filter(d=>!(['done','busted','trashed','missed'].includes(d.state)&&t-d.doneT>1.2));
  if(pile>=12)endGame('over');
  boss.t=Math.max(0,boss.t-dt);
}
function missDoc(d){
  d.state='missed';d.doneT=audioNow();pile++;sfxMiss();breakCombo(true);say('miss',1);
  hitText(d.x+DOC.w/2,d.y+DOC.h*.4,'未決裁…','#9a9a9a',1.1,'山+1');shake=Math.max(shake,8);
}
function fx(dt){
  parts.forEach(p=>{p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=p.g*dt;p.vx*=.985});parts=parts.filter(p=>p.t<p.life);
  if(parts.length>500)parts.splice(0,parts.length-500);
  rings.forEach(r=>{r.r+=r.v*dt;r.a-=dt*2.2});rings=rings.filter(r=>r.a>0);
  texts.forEach(s=>s.t+=dt);texts=texts.filter(s=>s.t<s.life);
  flyers.forEach(f=>{f.x+=f.vx*dt;f.y+=f.vy*dt;f.r+=f.vr*dt;if(f.pileUp&&f.y>H-60-Math.random()*H*.6){f.vy*=.6;f.vx*=.6}});
  shake=Math.max(0,shake-dt*60);flash=Math.max(0,flash-dt*3.2);stampAnim=Math.max(0,stampAnim-dt*7);
}

/* ---------- draw ---------- */
function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const sx=shake>0?rnd(-shake,shake)*.6:0,sy=shake>0?rnd(-shake,shake)*.6:0;
  ctx.save();ctx.translate(sx,sy);
  drawBG();
  if(state!=='title'){drawPile();docs.forEach(drawDoc);}
  else drawAttract();
  rings.forEach(r=>{ctx.strokeStyle=`rgba(${r.col},${r.a})`;ctx.lineWidth=6*r.a+1;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,7);ctx.stroke()});
  parts.forEach(p=>{ctx.globalAlpha=1-p.t/p.life;ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()});ctx.globalAlpha=1;
  flyers.forEach(drawFlyer);
  texts.forEach(drawText);
  if(state==='play'||state==='end')drawHUD();
  if(state==='play')drawHanko();
  ctx.restore();
  if(flash>0){ctx.fillStyle=`rgba(${flashCol},${Math.min(.85,flash)})`;ctx.fillRect(0,0,W,H)}
}
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  if(fever>0){g.addColorStop(0,'#3a1606');g.addColorStop(1,'#120806')}else{g.addColorStop(0,'#1b1830');g.addColorStop(1,'#0c0b12')}
  ctx.fillStyle=g;ctx.fillRect(-30,-30,W+60,H+60);
  // window w/ city
  ctx.fillStyle='#0a0a14';ctx.fillRect(W*.06,8,W*.88,70);
  for(let i=0;i<40;i++){const x=W*.06+((i*97)%Math.floor(W*.86)),h=20+((i*53)%46);ctx.fillStyle='#14142a';ctx.fillRect(x,78-h,26,h);
    if((i*7+Math.floor(T*.5))%5!==0){ctx.fillStyle='rgba(255,214,120,.55)';ctx.fillRect(x+5,78-h+6,4,3);ctx.fillRect(x+15,78-h+14,4,3)}}
  // fluorescent flicker
  const fl=(Math.sin(T*37)>.97)?.05:.13;ctx.fillStyle=`rgba(220,240,255,${fl})`;ctx.fillRect(0,0,W,H);
  // desk
  ctx.fillStyle=fever>0?'#4a2a12':'#2a2a3a';ctx.fillRect(0,92,W,H);
  ctx.strokeStyle='rgba(255,255,255,.04)';for(let y=100;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
  // speed lines during fever / perfect slowmo
  if(fever>0||slowmo>0){ctx.save();ctx.translate(W/2,H/2);for(let i=0;i<48;i++){const a=i/48*Math.PI*2+T*.6;ctx.strokeStyle=`rgba(255,203,46,${fever>0?.18:.1})`;ctx.lineWidth=rnd(1,4);ctx.beginPath();ctx.moveTo(Math.cos(a)*H*.35,Math.sin(a)*H*.35);ctx.lineTo(Math.cos(a)*W,Math.sin(a)*W);ctx.stroke()}ctx.restore()}
}
function drawAttract(){
  // slowly falling stamped papers behind title
  for(let i=0;i<9;i++){const x=((i*173+T*30*(1+i%3*.3))%(W+200))-100,y=((i*311+T*60*(1+i%2*.5))%(H+300))-200;
    ctx.save();ctx.translate(x,y);ctx.rotate(Math.sin(T*.7+i)*.5);ctx.fillStyle='rgba(255,250,240,.85)';ctx.fillRect(-60,-78,120,156);

/* ---------- ranking (Cloudflare D1 via /api) ---------- */
let rows=[],me=null,total=0,lastRun=null,tab='all',posting=false,online=null,runId=null;
const ROLES=['社長','専務','部長','課長','係長','新人','窓際'];
const SITE=location.origin+location.pathname;
const cleanName=v=>String(v??'').replace(/[\u0000-\u001f\u007f-\u009f­​-‏‪-‮⁠-⁯﻿]/g,'').trim().slice(0,10);
const rankName=()=>cleanName(ls.get('ouin-rkname')||myName)||myName;
const rid=()=>{const a=new Uint8Array(16);crypto.getRandomValues(a);return[...a].map(b=>b.toString(16).padStart(2,'0')).join('')};
let PID=ls.get('ouin-pid'),SECRET=ls.get('ouin-secret');

if(!SECRET||!/^[0-9a-f]{32}$/.test(SECRET)){SECRET=rid();ls.set('ouin-secret',SECRET)}
async function api(path,opt){const r=await fetch('/api/'+path,Object.assign({headers:{'content-type':'application/json'}},opt||{}));const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'error'),{status:r.status,body:j});return j}
async function loadBoard(){
  try{const j=await api('scores?pid='+PID);online=true;rows=Array.isArray(j.top)?j.top.map(validRow).filter(Boolean):[];me=j.me||null;total=Number(j.total)||0}
  catch(e){online=false}

}
function validRow(d){
  if(!d||typeof d!=='object')return null;
  const name=cleanName(d.name),score=Number(d.score),combo=Number(d.combo);
  if(!name||!Number.isFinite(score)||score<0||!Number.isFinite(combo))return null;
  return{name,score:Math.floor(score),combo:Math.floor(combo),role:ROLES.includes(d.role)?d.role:'—',me:!!d.me};
}
function requestRun(){runId=null;api('start',{method:'POST',body:JSON.stringify({pid:PID})}).then(j=>{runId=typeof j.rid==='string'?j.rid:null}).catch(()=>{})}

  const el=document.createElement('li');if(mine)el.className='me';
  el.innerHTML='<span class="no"></span><span class="nm"></span><span class="rl"></span><span class="pt"></span>';
  el.querySelector('.no').textContent=no;el.querySelector('.nm').textContent=name+(mine?'（あなた）':'');el.querySelector('.rl').textContent=role;
  const pt=el.querySelector('.pt');pt.textContent=score.toLocaleString();const sm=document.createElement('small');sm.textContent=`最大${combo}コンボ`;pt.appendChild(sm);

function renderBoard(){
  const ul=$('#bd-list');if(!ul)return;ul.textContent='';
  $('#tab-all').setAttribute('aria-pressed',tab==='all');$('#tab-me').setAttribute('aria-pressed',tab==='me');
  if(tab==='all'){
    if(online===null){ul.innerHTML='<p class="empty">掲示板を読み込み中…</p>';$('#bd-note').textContent='';return}

function showMyRank(rank,tot){const el=$('#r-myrank');el.hidden=false;el.innerHTML='全国 <b></b> 位 ／ <span></span>人中';el.querySelector('b').textContent=rank;el.querySelector('span').textContent=tot}
async function post(){

    if(j.improved)showMyRank(j.rank,j.total);else{el.textContent=`自己ベスト ${Number(j.best||0).toLocaleString()} pt で掲示中（全国 ${j.rank}位）`}

  }catch(e){
    const m={run:'このプレイは記録できません（オフラインで始めたか、すでに貼り出し済み）',rate:'少し待ってからもう一度押してください',name:'その名前は使えません',value:'記録が正しくないため受け付けられませんでした',owner:'この名前の記録は別の端末のものです'};

function tweet(){

const openBoard=()=>{renderBoard();$('#o-board').hidden=false;$('#btn-board-close').focus();loadBoard()};

$('#tab-all').addEventListener('click',()=>{tab='all';renderBoard()});

document.fonts&&document.fonts.ready.then(()=>buildSeals());buildSeals();
